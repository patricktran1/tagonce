name: Publish TagOnce source

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part* | base64 --decode > /tmp/tagonce-source.tar.xz
          tar -xJf /tmp/tagonce-source.tar.xz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit published application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish TagOnce MVP"
          git push

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tagonce-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture lint diagnostics
        id: lint
        shell: bash
        run: |
          set +e
          npm run lint 2>&1 | tee lint.txt
          exit_code=${PIPESTATUS[0]}
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload lint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tagonce-lint
          path: lint.txt
          if-no-files-found: error
          retention-days: 14

      - name: Enforce lint result
        if: steps.lint.outputs.exit_code != '0'
        run: exit 1

      - name: Unit tests
        run: npm test

      - name: Coverage
        run: npm run test:coverage

      - name: Production build
        run: npm run build

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tagonce-coverage
          path: coverage/coverage-summary.json
          if-no-files-found: warn
          retention-days: 14
